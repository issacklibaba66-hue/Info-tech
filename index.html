<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Page - Info-tech</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#">Info-tech</a>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list">Menu</button>
        <ul id="nav-list" class="nav-list">
          <li><a href="#">Home</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">Make your site fit every screen</h1>
      <p class="hero-lead">Simple responsive layout using CSS Grid/Flex + fluid typography.</p>
    </section>

    <section class="cards row">
      <article class="card col">
        <img src="placeholder.jpg" alt="Placeholder" class="card-img" />
        <h3>Card title</h3>
        <p>Card description text goes here.</p>
      </article>

      <article class="card col">
        <img src="placeholder.jpg" alt="Placeholder" class="card-img" />
        <h3>Card title</h3>
        <p>Card description text goes here.</p>
      </article>

      <article class="card col">
        <img src="placeholder.jpg" alt="Placeholder" class="card-img" />
        <h3>Card title</h3>
        <p>Card description text goes here.</p>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Info-tech</p>
    </div>
  </footer>

  <script>
    // Small script for nav toggle and footer year
    document.querySelector('#year').textContent = new Date().getFullYear();
    const btn = document.querySelector('.nav-toggle');
    const navList = document.querySelector('#nav-list');
    btn.addEventListener('click', () => {
      const expanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!expanded));
      navList.classList.toggle('open');
    });
  </script>
</body>
</html>
